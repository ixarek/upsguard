name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: sh -n install.sh && sh -n uninstall.sh
      - name: Verify bundled packages
        run: cd debs && sha256sum -c SHA256SUMS
